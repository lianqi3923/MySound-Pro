name: Live parser reliability

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-parser-test
  cancel-in-progress: false

jobs:
  random-100:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run rate-limited random 100 test
        run: >-
          ./gradlew --no-daemon :mysound-sources:test
          --tests "io.github.mysoundpro.sources.LiveSourceReliabilityTest.random*"
          -Pmysound.live=true -Pmysound.live.sampleSize=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-parser-report-${{ github.run_id }}
          path: |
            mysound-sources/build/reports/live/
            mysound-sources/build/reports/tests/
          if-no-files-found: warn
      - name: Create maintenance issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Live Parser] nightly failure";
            const body = `Nightly live parser test failed on ${new Date().toISOString()}.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nDo not add bypass logic. Triage using docs/maintenance.md.`;
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open"
            });
            if (!data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
