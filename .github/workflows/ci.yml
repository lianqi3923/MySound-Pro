name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and verify release bundle
        run: >-
          ./gradlew --no-daemon clean test :mysound-myting-host:verifyReleaseBundle
          -PprojectUrl="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysound-pro-${{ github.sha }}
          path: |
            mysound-myting-host/build/release/
            **/build/reports/tests/
          if-no-files-found: warn
